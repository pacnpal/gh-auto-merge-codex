name: Test

# The unit and window tests, on each pull request that touches the app or its build. The
# Release workflow runs them too, but only when a release is cut by hand.

on:
  pull_request:
    paths:
      - 'prherd.py'
      - 'test_prherd.py'
      - 'packaging/**'
      - 'scripts/demo-gh/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -m unittest -v test_prherd
