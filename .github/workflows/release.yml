name: Release

# Builds prherd for every platform it ships on, signs and notarizes the macOS apps, and
# publishes a GitHub release. pacnpal/free-ai-release-notes has a free OpenRouter model write
# the title and notes from every commit since the last v* tag.
#
# Only ever run by hand (Actions -> Release -> Run workflow): never on a push, a tag or a
# merge. The version is what you type; the run tags v<version> on the commit it ran on. A
# version with a -suffix (1.3.0-rc.1) is published as a prerelease. "Dry run" builds, signs
# and notarizes everything and writes the notes to the run summary, but publishes nothing.
#
# Builds:
#   macOS    arm64 (Apple silicon) and x64 (Intel): signed, notarized .dmg
#   Windows  x64, arm64 and x86 (32-bit): .zip, not code-signed (docs/releasing.md)
#   Linux    x64 and arm64: .tar.gz, .deb, .rpm, .pkg.tar.zst (Arch) and .AppImage, built on
#            Debian 11's glibc so they run on Debian 11+, Ubuntu 20.04+ and RHEL 9+
#
# Secrets (see docs/releasing.md): MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD,
# MACOS_SIGNING_IDENTITY, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID,
# OPENROUTER_API_KEY (required). A release fails without the macOS signing secrets unless
# the repository variable ALLOW_UNSIGNED_RELEASES is 'true'.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0 or 1.3.0-rc.1 (tagged v<version>)
        required: true
        type: string
      dry-run:
        description: Build, sign and notarize everything, but publish nothing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Version from the input
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 1.2.0 or 1.3.0-rc.1"; exit 1
          fi
          tag="v$version"
          release=true; [ "$DRY_RUN" = true ] && release=false
          if [ "$release" = true ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; pick a new version"; exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"; echo "tag=$tag"; echo "release=$release"; echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### prherd $version" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: $release · prerelease: $prerelease · commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -m unittest -v test_prherd

  build:
    name: Build (${{ matrix.name }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64, arch: x64 }
          - { os: windows-11-arm, name: windows-arm64, arch: arm64 }
          - { os: windows-latest, name: windows-x86, arch: x86 }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
      NAME: ${{ matrix.name }}
      ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASES }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- macOS and Windows: the runner's own Python ------------------------------
      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      - name: Build
        if: runner.os != 'Linux'
        run: |-
          python -c "import platform, tkinter; print(platform.machine(), platform.architecture()[0], 'Tk', tkinter.TkVersion)"
          python -m pip install -r packaging/requirements.txt
          python packaging/build.py --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      # ---- macOS: sign, notarize, DMG ------------------------------------------------
      - name: Sign, notarize and package (macOS)
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          # Notarization signs in with an App Store Connect API key, not an Apple ID and password.
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |-
          app=dist/prherd.app
          dmg="out/prherd-${VERSION}-${NAME}.dmg"
          mkdir -p out
          # A dry run signs and notarizes too, so it tests what a release would do.
          signed=false; notarize=false
          if [ -n "$P12" ] && [ -n "$IDENTITY" ]; then
            signed=true
            [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ] && notarize=true
          fi
          if [ "$RELEASE" = true ] && [ "$notarize" != true ] && [ "$ALLOW_UNSIGNED" != true ]; then
            echo "::error::a release needs the macOS signing and notarization secrets (or ALLOW_UNSIGNED_RELEASES=true)"; exit 1
          fi

          if [ "$signed" = true ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            kc_password="$(uuidgen)"
            security create-keychain -p "$kc_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$kc_password" "$keychain"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            codesign --force --deep --options runtime --timestamp \
              --entitlements packaging/entitlements.plist --sign "$IDENTITY" "$app"
          else
            echo "::warning::macOS build is ad-hoc signed; Gatekeeper will warn on first open"
            codesign --force --deep --options runtime --entitlements packaging/entitlements.plist --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/prherd"
          "$app/Contents/MacOS/prherd" --version

          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname "prherd ${VERSION}" -srcfolder "$stage" -ov -format UDZO "$dmg"

          if [ "$signed" = true ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          fi
          if [ "$notarize" = true ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$API_KEY" > "$key"
            xcrun notarytool submit "$dmg" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
              --wait --timeout 30m || { rm -f "$key"; exit 1; }
            rm -f "$key"
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          fi

      - name: Remove signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # ---- Windows: zip. Not code-signed, by choice: see docs/releasing.md ---------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path 'dist\prherd' -DestinationPath "out\prherd-$($env:VERSION)-$($env:NAME).zip"

      # ---- Linux: built on Debian 11's glibc, then packaged every common way ------
      - name: Build (Linux)
        if: runner.os == 'Linux'
        # Debian 11's image already has Python and Tk, so nothing is installed from its archived apt
        # repos. Run as the runner's user, so the next step can write over what this one made.
        run: |-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src python:3.13-bullseye \
            bash -c 'python3 -m pip install --user --quiet -r packaging/requirements.txt &&
                     python3 packaging/build.py --version "$0" && ./dist/prherd/prherd --version' "$VERSION"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux.sh "$VERSION"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prherd-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: ${{ needs.version.outputs.release == 'true' && 'Publish release' || 'Write release notes (dry run)' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE: ${{ needs.version.outputs.release }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the notes read every commit since the last release
          persist-credentials: false

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prherd-*
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Write title and notes
        id: notes
        uses: pacnpal/free-ai-release-notes@76e53c73233b9dfc37cb0aff5ed6359d139b4c7c # v1.0.0
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          tag: ${{ needs.version.outputs.tag }}
          target: ${{ github.sha }}
          tag-pattern: 'v[0-9]*'
          title-template: '{tag} - {title}'
          append-changelog-link: ${{ needs.version.outputs.release }}  # a dry run's tag never exists

      - name: Add the download table
        env:
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |-
          f() { printf '`prherd-%s-%s`' "$VERSION" "$1"; }
          { cat "$NOTES_FILE"; cat <<EOF

          ## Download

          | Platform | Get |
          | --- | --- |
          | macOS, Apple silicon | $(f macos-arm64.dmg) |
          | macOS, Intel | $(f macos-x64.dmg) |
          | Windows, x64 | $(f windows-x64.zip) |
          | Windows, ARM | $(f windows-arm64.zip) |
          | Windows, 32-bit | $(f windows-x86.zip) |
          | Debian, Ubuntu, Mint | $(f linux-x64.deb), or \`-linux-arm64.deb\` |
          | Fedora, RHEL, Rocky, Alma, openSUSE | $(f linux-x64.rpm), or \`-linux-arm64.rpm\` |
          | Arch, Manjaro | $(f linux-x64.pkg.tar.zst), or \`-linux-arm64.pkg.tar.zst\` |
          | Any other Linux | $(f linux-x64.AppImage) or \`.tar.gz\`, and their \`-linux-arm64\` builds |

          prherd runs the [GitHub CLI](https://cli.github.com) (\`gh\` 2.48 or newer), signed in with merge
          rights on the repos you watch. Checksums are in \`SHA256SUMS.txt\`. The Windows builds aren't
          code-signed, so SmartScreen asks first: choose **More info**, then **Run anyway**. The Linux
          builds need glibc 2.31 or newer (Debian 11, Ubuntu 20.04, RHEL 9 and later).
          EOF
          } > "$RUNNER_TEMP/notes.md"
          { echo "## $TITLE"; echo; cat "$RUNNER_TEMP/notes.md"; echo; echo '```'; ls -l out; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |-
          args=(--title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA")
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" "${args[@]}"
