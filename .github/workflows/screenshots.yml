name: Screenshots

# Regenerate the README screenshots in docs/screenshots/ and commit them back.
# Runs the real prherd window on a virtual display (Xvfb), fed demo data by a
# stand-in gh (scripts/demo-gh/gh), so nothing reaches GitHub and no token is
# needed to take the shots. See scripts/screenshots.sh.
#
# Trigger: manual, or a push to main that touches the app or the screenshot
# setup. A pull request takes the shots and uploads them as an artifact without
# committing. The push back uses the automatic GITHUB_TOKEN, which does not
# re-trigger workflows, so there is no loop.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prherd.py'
      - 'assets/**'
      - 'scripts/screenshots.sh'
      - 'scripts/demo-gh/**'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'prherd.py'
      - 'assets/**'
      - 'scripts/screenshots.sh'
      - 'scripts/demo-gh/**'
      - '.github/workflows/screenshots.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Take screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No checkout token on disk while the app runs. The separate commit job
          # is the only job with write permission.
          persist-credentials: false

      - name: Cache Cargo (oxipng)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-oxipng

      - name: Install Tk, Xvfb and capture tools
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb x11-utils xdotool imagemagick fonts-dejavu-core

      - name: Install Oxipng if it is not installed
        run: which oxipng || cargo install oxipng

      - name: Take screenshots
        run: bash scripts/screenshots.sh

      - name: Optimize PNGs
        run: oxipng -o 4 -i 0 --strip safe docs/screenshots/*.png

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error

  commit:
    name: Commit screenshots
    runs-on: ubuntu-latest
    needs: screenshots
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download screenshot artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: docs/screenshots

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "chore(screenshots): refresh UI screenshots [skip ci]" || exit 0
          # Credentials aren't persisted on the checkout, so authenticate the
          # remote here (only this step needs write access).
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "${remote}" "${GITHUB_REF_NAME}"
          git push "${remote}" "HEAD:${GITHUB_REF_NAME}"
